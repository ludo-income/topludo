<title>Top Ludo - Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a1628;color:#fff;font-family:Arial,sans-serif;min-height:100%;}
body{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;position:relative;padding-bottom:70px;}
.top{padding:16px;display:flex;align-items:center;gap:12px;}
.avatar{width:56px;height:56px;border-radius:50%;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:28px;}
.info h2{font-size:17px;font-weight:700;}
.info p{font-size:12px;color:#94a3b8;margin-top:2px;}
.uid{font-size:11px;color:#64748b;margin-top:2px;}
.balance-card{margin:0 16px 16px;background:linear-gradient(135deg,#0f2744,#0c1a2e);border-radius:16px;padding:16px;border:1px solid #1e3a5f;}
.bal-label{font-size:11px;color:#94a3b8;letter-spacing:.5px;}
.bal-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.bal-amount{font-size:26px;font-weight:800;}
.add-btn{background:#22c55e;color:#000;border:0;border-radius:20px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;}
.winning{font-size:12px;color:#fbbf24;margin-top:6px;}
.stats-row{display:flex;gap:8px;margin-top:14px;}
.mini-stat{flex:1;background:#0a1628;border-radius:10px;padding:10px;text-align:center;}
.mini-stat .n{font-size:18px;font-weight:800;}
.mini-stat .l{font-size:10px;color:#94a3b8;margin-top:2px;}
.section{padding:0 16px;margin-bottom:8px;}
.section-title{font-size:12px;color:#64748b;margin:12px 0 8px;letter-spacing:1px;}
.menu-item{display:flex;align-items:center;justify-content:space-between;background:#0f2138;border-radius:12px;padding:14px 16px;margin-bottom:8px;text-decoration:none;color:#e2e8f0;font-size:14px;}
.menu-item span{display:flex;align-items:center;gap:10px;}
.menu-item .arrow{color:#64748b;}
.logout{color:#f87171 !important;}
.version{text-align:center;font-size:11px;color:#475569;padding:16px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;height:64px;background:#0c1a2e;display:flex;border-top:1px solid #1e293b;z-index:30;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#64748b;font-size:11px;gap:3px;}
.nav-item.active{color:#38bdf8;}
.nav-item svg{width:22px;height:22px;}
</style>
</head>
<body>
<div class="top">
  <div class="avatar">👤</div>
  <div class="info">
    <h2>Player</h2>
    <p>player@topludo.com</p>

  </div>
</div>

<div class="balance-card">

  <div class="bal-row">
    <div class="bal-amount">BDT 0</div>
    <button class="add-btn" onclick="alert('Add Money coming soon')">+ ADD</button>
  </div>
  <div class="winning">🏆 Winning: 0</div>
  <div class="stats-row">
    <div class="mini-stat"><div class="n">0</div><div class="l">MATCHES</div></div>
    <div class="mini-stat"><div class="n">0</div><div class="l">REFERS</div></div>
    <div class="mini-stat"><div class="n">0</div><div class="l">WINNINGS</div></div>
  </div>
</div>
