<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Top Ludo</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #050a18;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: #070d1f;
  position: relative;
  padding-bottom: 85px;
  overflow-x: hidden;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px 6px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-box {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, #ffcc00, #ff9900);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 4px 12px rgba(255, 180, 0, 0.45);
}

.logo-box::after {
  content: "👑";
  position: absolute;
  top: -10px;
  font-size: 16px;
}

.logo-text {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.logo-text span {
  color: #ffd700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bell {
  width: 38px;
  height: 38px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.coin {
  height: 38px;
  padding: 0 12px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 15px;
}

/* ===== HERO ===== */
.hero {
  text-align: center;
  padding: 8px 20px 18px;
}

.hero-visual {
  width: 240px;
  height: 190px;
  margin: 0 auto 8px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Board */
.board {
  width: 150px;
  height: 150px;
  background: linear-gradient(160deg, #1a2744, #0e162b);
  border-radius: 18px;
  border: 3px solid #2c3f68;
  position: relative;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  transform: perspective(400px) rotateX(18deg) rotateZ(-4deg);
}

.board-inner {
  position: absolute;
  inset: 14px;
  border: 2px solid #3a527a;
  border-radius: 10px;
}

/* Pawns */
.pawn {
  position: absolute;
  width: 24px;
  height: 32px;
  border-radius: 50% 50% 45% 45%;
  box-shadow: 0 6px 12px rgba(0,0,0,0.5);
}

.pawn::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 8px;
  background: inherit;
  border-radius: 50%;
  filter: brightness(0.7);
}

.p-red { background: linear-gradient(#ff5a5a, #d40000); top: 12px; left: 22px; }
.p-yellow { background: linear-gradient(#ffe066, #e6b800); top: 55px; left: 8px; }
.p-green { background: linear-gradient(#00e676, #00a040); top: 12px; right: 22px; }
.p-blue { background: linear-gradient(#40c4ff, #0091ea); bottom: 18px; right: 18px; }

/* Dice */
.dice {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%) rotate(12deg);
  width: 52px;
  height: 52px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 40px rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 700;
  color: #222;
}

/* Lightning glow */
.glow {
  position: absolute;
  width: 180px;
  height: 180px;
  background: radial-gradient(circle, rgba(100,180,255,0.25) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.hero h1 {
  font-size: 34px;
  font-weight: 800;
  margin-bottom: 4px;
  letter-spacing: -0.8px;
}

.hero p {
  font-size: 15px;
  color: #8b9bb8;
  margin-bottom: 22px;
}

.play-btn {
  width: 100%;
  max-width: 300px;
  height: 56px;
  background: linear-gradient(90deg, #ffd600, #ffb300);
  border: none;
  border-radius: 28px;
  font-size: 20px;
  font-weight: 700;
  color: #1a1a1a;
  box-shadow: 0 8px 28px rgba(255, 200, 0, 0.45);
  cursor: pointer;
}

.play-btn:active {
  transform: scale(0.97);
}

/* ===== TABS ===== */
.tabs {
  display: flex;
  gap: 12px;
  padding: 0 18px 16px;
}

.tab {
  flex: 1;
  height: 44px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-weight: 600;
  font-size: 15px;
  border: none;
  cursor: pointer;
}

.tab.active {
  background: #00c2ff;
  color: #00324d;
}

.tab:not(.active) {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,0.12);
  color: #8b9bb8;
}

/* ===== LUDO MATCHES CARD ===== */
.card {
  margin: 0 18px 14px;
  background: linear-gradient(135deg, #101b33, #0c1426);
  border-radius: 18px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  border: 1px solid rgba(255,255,255,0.06);
  overflow: hidden;
}

.card-img {
  width: 72px;
  height: 72px;
  background: linear-gradient(145deg, #1a2744, #121c32);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.mini-board {
  width: 52px;
  height: 52px;
  background: #0d1628;
  border: 2px solid #2a3f68;
  border-radius: 8px;
  position: relative;
}

.mini-pawn {
  position: absolute;
  width: 10px;
  height: 14px;
  border-radius: 50% 50% 40% 40%;
}

.mp-red { background: #ff4d4d; top: 6px; left: 8px; }
.mp-blue { background: #40c4ff; bottom: 8px; left: 10px; }
.mp-green { background: #00e676; top: 6px; right: 8px; }
.mp-yellow { background: #ffd700; bottom: 8px; right: 8px; }

.card-content h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
}

.card-content p {
  font-size: 12px;
  color: #7a8ba8;
  letter-spacing: 0.3px;
}

.badge {
  position: absolute;
  top: 12px;
  right: 14px;
  background: #ffcc00;
  color: #1a1a1a;
  font-size: 12px;
  font-weight: 700;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== TELEGRAM ===== */
.telegram {
  margin: 0 18px 14px;
  background: linear-gradient(135deg, #0d1a30, #0a1425);
  border-radius: 18px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(0, 160, 255, 0.12);
}

.tg-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tg-icon {
  width: 42px;
  height: 42px;
  background: #0088cc;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.tg-text h3 {
  font-size: 16px;
  font-weight: 600;
}

.tg-text p {
  font-size: 12px;
  color: #7a8ba8;
}

.join-btn {
  background: #ffcc00;
  color: #1a1a1a;
  border: none;
  border-radius: 20px;
  padding: 9px 16px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

/* ===== WITHDRAW ===== */
.withdraw {
  margin: 0 18px 20px;
  background: linear-gradient(135deg, #0f1a30, #0c1526);
  border-radius: 18px;
  padding: 24px 16px 20px;
  text-align: center;
  position: relative;
  border: 1px solid rgba(255,255,255,0.05);
}

.shield {
  width: 54px;
  height: 54px;
  background: #00c853;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  font-size: 26px;
  box-shadow: 0 0 24px rgba(0, 200, 83, 0.45);
}

.withdraw h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.withdraw p {
  font-size: 13px;
  color: #7a8ba8;
}

.chat-btn {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #00e5ff, #0091ea);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 4px 18px rgba(0, 180, 255, 0.5);
}

.chat-label {
  position: absolute;
  top: -9px;
  right: -4px;
  background: #00e5ff;
  color: #003344;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 8px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  height: 72px;
  background: #0a1020;
  border-top: 1px solid rgba(255,255,255,0.07);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding-bottom: 10px;
  z-index: 50;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  color: #6b7c99;
  cursor: pointer;
  min-width: 70px;
}

.nav-item.active {
  color: #fff;
}

.nav-item.active .nav-icon {
  background: rgba(255,255,255,0.12);
  width: 52px;
  height: 32px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon {
  font-size: 22px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-box"></div>
      <div class="logo-text">TOP <span>LUDO</span></div>
    </div>
    <div class="header-right">
      <div class="bell">🔔</div>
      <div class="coin">
        <span>🪙</span>
        <span>0</span>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-visual">
      <div class="glow"></div>
      <div class="board">
        <div class="board-inner"></div>
        <div class="pawn p-red"></div>
        <div class="pawn p-yellow"></div>
        <div class="pawn p-green"></div>
        <div class="pawn p-blue"></div>
        <div class="dice">⚅</div>
      </div>
    </div>
    <h1>Top Ludo</h1>
    <p>Ludo in under 10 minutes</p>
    <button class="play-btn">Play Now</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active">🎮 Games</button>
    <button class="tab">▦ Others</button>
  </div>

  <!-- Ludo Matches -->
  <div class="card">
    <div class="card-img">
      <div class="mini-board">
        <div class="mini-pawn mp-red"></div>
        <div class="mini-pawn mp-blue"></div>
        <div class="mini-pawn mp-green"></div>
        <div class="mini-pawn mp-yellow"></div>
      </div>
    </div>
    <div class="card-content">
      <h3>Ludo Matches</h3>
      <p>REGULAR 1 VS 1</p>
    </div>
    <div class="badge">0</div>
  </div>

  <!-- Telegram -->
  <div class="telegram">
    <div class="tg-left">
      <div class="tg-icon">✈️</div>
      <div class="tg-text">
        <h3>Telegram</h3>
        <p>Get updates & latest news</p>
      </div>
    </div>
    <button class="join-btn">Join Now →</button>
  </div>

  <!-- Instant Withdrawals -->
  <div class="withdraw">
    <div class="shield">🛡️</div>
    <h3>Instant withdrawals</h3>
    <p>100% safe payments</p>
    <div class="chat-btn">
      🤖
      <div class="chat-label">CHAT</div>
    </div>
  </div>

</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active">
    <div class="nav-icon">🏠</div>
    <span>Home</span>
  </div>
  <div class="nav-item">
    <div class="nav-icon">👥</div>
    <span>Refer</span>
  </div>
  <div class="nav-item">
    <div class="nav-icon">👤</div>
    <span>Profile</span>
  </div>
</div>

</body>
  </html>
