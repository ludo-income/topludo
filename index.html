<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Top Ludo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:#06152b;
    color:#fff;
}

body{
    overflow-x:hidden;
}

/* =========================
   MAIN APP
========================= */

.app{
    width:100%;
    max-width:752px;
    min-height:100vh;
    margin:auto;
    position:relative;
    background:
        radial-gradient(
            circle at 50% 23%,
            rgba(21,74,137,.34),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #08265a 0%,
            #071e43 20%,
            #06182f 52%,
            #041326 100%
        );
    overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:88px;
    padding:16px 25px 10px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:125px;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.logo-crown{
    position:absolute;
    top:-1px;
    left:46px;
    font-size:29px;
    filter:drop-shadow(0 2px 2px #000);
}

.logo-text{
    position:relative;
    z-index:2;
    font-weight:1000;
    font-size:27px;
    line-height:24px;
    text-align:center;
    letter-spacing:-1.5px;
    color:#ffe600;
    text-shadow:
        2px 2px 0 #e60000,
        -1px -1px 0 #fff,
        3px 4px 4px #000;
}

.logo-text span{
    display:block;
    color:#19bfff;
    font-size:32px;
    letter-spacing:-2px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.bell{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffe600;
    font-size:27px;
    filter:drop-shadow(0 0 5px rgba(255,221,0,.35));
}

.balance{
    height:49px;
    min-width:91px;
    padding:0 13px;
    border-radius:28px;
    background:#f7f7f7;
    color:#101010;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:23px;
    font-weight:800;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.balance-symbol{
    width:29px;
    height:29px;
    border-radius:50%;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:18px;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    padding:5px 28px 0;
}

.ludo-art{
    width:100%;
    height:260px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* central board */

.board{
    position:absolute;
    width:265px;
    height:142px;
    transform:perspective(350px) rotateX(55deg) rotateZ(-1deg);
    bottom:30px;
    border:8px solid #e9edf0;
    background:
        linear-gradient(90deg,
            #216ee5 0 25%,
            #fff 25% 50%,
            #f53d3d 50% 75%,
            #20a84d 75%);
    box-shadow:
        0 15px 25px rgba(0,0,0,.5),
        0 0 25px rgba(255,255,255,.15);
}

.board:before,
.board:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.9);
}

.board:before{
    width:100%;
    height:8px;
    top:44%;
    left:0;
}

.board:after{
    height:100%;
    width:8px;
    left:47%;
    top:0;
}

/* pawns */

.pawn{
    position:absolute;
    width:58px;
    height:120px;
    border-radius:50% 50% 45% 45%;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,.5));
}

.pawn:before{
    content:"";
    position:absolute;
    top:0;
    left:8px;
    width:43px;
    height:43px;
    border-radius:50%;
    background:inherit;
    box-shadow:
        inset -7px -7px 10px rgba(0,0,0,.25),
        inset 7px 7px 9px rgba(255,255,255,.22);
}

.pawn:after{
    content:"";
    position:absolute;
    left:10px;
    top:34px;
    width:39px;
    height:78px;
    border-radius:20px 20px 12px 12px;
    background:inherit;
}

.pawn.red{
    background:#f12f38;
    transform:rotate(-18deg);
    left:28%;
    top:27px;
}

.pawn.green{
    background:#16d65b;
    transform:rotate(16deg);
    right:27%;
    top:38px;
}

.pawn.blue{
    background:#168be9;
    transform:rotate(24deg);
    right:21%;
    top:107px;
    transform:scale(.72) rotate(24deg);
}

.pawn.yellow{
    background:#ffc800;
    transform:rotate(-27deg);
    left:23%;
    top:100px;
    transform:scale(.72) rotate(-27deg);
}

/* dice */

.dice{
    position:absolute;
    width:88px;
    height:88px;
    background:#f5f5f5;
    border-radius:24px;
    transform:
        rotate(19deg)
        skewY(-3deg);
    bottom:65px;
    z-index:10;
    box-shadow:
        0 10px 16px rgba(0,0,0,.4),
        inset 3px 3px 8px rgba(255,255,255,.9);
}

.dot{
    position:absolute;
    width:12px;
    height:12px;
    background:#282828;
    border-radius:50%;
}

.d1{top:16px;left:18px}
.d2{top:16px;right:18px}
.d3{top:38px;left:38px}
.d4{bottom:16px;left:18px}
.d5{bottom:16px;right:18px}
.d6{top:38px;right:18px}

.hero h1{
    font-size:52px;
    line-height:1;
    margin-top:-2px;
    font-weight:800;
    letter-spacing:-1.5px;
    text-shadow:0 3px 5px rgba(0,0,0,.3);
}

.hero-subtitle{
    margin-top:18px;
    font-size:27px;
    color:#f0f0f0;
    font-weight:400;
}

/* =========================
   PLAY BUTTON
========================= */

.play-btn{
    width:82%;
    height:84px;
    margin:28px auto 0;
    border:0;
    border-radius:48px;
    background:linear-gradient(
        180deg,
        #ffe900 0%,
        #ffd300 100%
    );
    color:#050505;
    font-size:28px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:
        0 0 14px rgba(255,226,0,.65),
        0 5px 18px rgba(0,0,0,.28);
}

/* =========================
   TABS
========================= */

.tabs{
    width:92%;
    height:77px;
    margin:60px auto 0;
    padding:6px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:34px;
    display:flex;
    background:rgba(5,22,43,.48);
    box-shadow:
        inset 0 0 15px rgba(0,0,0,.12);
}

.tab{
    flex:1;
    border:0;
    border-radius:28px;
    background:transparent;
    color:#eee;
    font-size:25px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
}

.tab.active{
    background:linear-gradient(
        180deg,
        #12c6ed,
        #08a9d4
    );
    box-shadow:
        0 0 13px rgba(0,203,255,.45);
}

.tab-icon{
    font-size:27px;
}

/* =========================
   CONTENT CARDS
========================= */

.content{
    width:92%;
    margin:34px auto 150px;
}

.game-card{
    height:193px;
    border-radius:22px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    padding:20px 26px;
    background:
        radial-gradient(
            circle at 68% 50%,
            rgba(0,124,255,.35),
            transparent 37%
        ),
        linear-gradient(
            90deg,
            #031c39,
            #062b5a
        );
    border:1px solid rgba(255,255,255,.04);
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.15);
}

.game-card:after{
    content:"0";
    position:absolute;
    top:-17px;
    right:-1px;
    width:37px;
    height:37px;
    border-radius:50%;
    background:#ffe600;
    color:#000;
    font-weight:900;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.game-icon{
    width:76px;
    height:76px;
    flex-shrink:0;
    border-radius:13px;
    background:
        linear-gradient(135deg,#ef3131,#20ad54 45%,#efcf00);
    border:7px solid #11274a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

.game-info{
    margin-left:25px;
}

.game-title{
    font-size:25px;
    font-weight:800;
}

.game-subtitle{
    margin-top:7px;
    font-size:18px;
    color:#b7bac1;
    letter-spacing:.4px;
}

/* =========================
   TELEGRAM
========================= */

.telegram-card{
    min-height:137px;
    margin-top:22px;
    padding:20px 25px;
    border-radius:24px;
    display:flex;
    align-items:center;
    border:1px solid rgba(0,183,255,.48);
    background:
        linear-gradient(
            90deg,
            rgba(5,63,100,.82),
            rgba(8,50,79,.55)
        );
    box-shadow:
        0 0 20px rgba(0,171,255,.08);
}

.telegram-icon{
    width:73px;
    height:73px;
    flex-shrink:0;
    border-radius:50%;
    background:#10aef0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    box-shadow:
        0 0 18px rgba(0,190,255,.28);
}

.telegram-info{
    margin-left:24px;
    flex:1;
}

.telegram-title{
    font-size:25px;
    font-weight:800;
}

.telegram-sub{
    font-size:19px;
    color:#d3d6db;
    margin-top:6px;
}

.join-btn{
    height:56px;
    min-width:177px;
    border:0;
    border-radius:30px;
    background:#ffe000;
    color:#050505;
    font-size:20px;
    font-weight:800;
    box-shadow:
        0 0 13px rgba(255,223,0,.5);
}

/* =========================
   WITHDRAW CARD
========================= */

.withdraw-card{
    height:270px;
    margin-top:29px;
    border-radius:26px;
    border:1px solid rgba(255,255,255,.16);
    background:
        radial-gradient(
            circle at 78% 75%,
            rgba(0,194,255,.16),
            transparent 22%
        ),
        linear-gradient(
            135deg,
            rgba(18,38,59,.88),
            rgba(7,26,43,.8)
        );
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.shield{
    width:91px;
    height:91px;
    border-radius:50%;
    background:#36d45e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    box-shadow:
        0 0 25px rgba(54,212,94,.18);
}

.withdraw-title{
    margin-top:22px;
    font-size:25px;
    font-weight:800;
}

.withdraw-sub{
    margin-top:12px;
    font-size:20px;
    color:#d6d9de;
}

/* chat graphic */

.chat{
    position:absolute;
    right:20px;
    bottom:27px;
    width:105px;
    height:80px;
}

.chat-bubble{
    position:absolute;
    background:#16c9ee;
    border-radius:20px;
    padding:5px 11px;
    font-size:14px;
    font-weight:700;
    top:0;
    right:0;
}

.chat-circle{
    width:65px;
    height:65px;
    position:absolute;
    right:15px;
    bottom:0;
    border-radius:50%;
    background:
        radial-gradient(circle,#4bd9ef,#1689c9);
    box-shadow:0 0 20px rgba(0,205,255,.3);
}

.chat-dot{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#12c5ed;
}

.chat-dot.a{
    left:0;
    top:36px;
}

.chat-dot.b{
    right:0;
    top:47px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:100;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(752px,100%);
    height:116px;
    padding:10px 25px 14px;
    border-radius:39px 39px 0 0;
    border:1px solid rgba(255,255,255,.18);
    background:
        linear-gradient(
            180deg,
            rgba(9,39,70,.96),
            rgba(3,20,39,.98)
        );
    display:flex;
    align-items:center;
    justify-content:space-between;
    backdrop-filter:blur(15px);
}

.nav-item{
    width:31%;
    height:75px;
    border-radius:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#f3f3f3;
    font-size:18px;
    font-weight:600;
}

.nav-item.active{
    background:
        linear-gradient(
            180deg,
            rgba(118,174,201,.45),
            rgba(62,111,140,.45)
        );
    border:1px solid rgba(255,255,255,.35);
    box-shadow:
        inset 0 0 20px rgba(255,255,255,.05);
}

.nav-icon{
    font-size:27px;
    line-height:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .topbar{
        height:76px;
        padding:10px 18px;
    }

    .logo{
        width:105px;
        height:62px;
    }

    .logo-text{
        font-size:23px;
    }

    .logo-text span{
        font-size:27px;
    }

    .logo-crown{
        left:39px;
        font-size:24px;
    }

    .balance{
        height:45px;
        min-width:83px;
        font-size:21px;
    }

    .bell{
        font-size:25px;
    }

    .top-right{
        gap:14px;
    }

    .ludo-art{
        height:225px;
    }

    .board{
        width:235px;
        height:125px;
    }

    .pawn{
        transform:scale(.82);
    }

    .dice{
        width:76px;
        height:76px;
        bottom:61px;
    }

    .hero h1{
        font-size:42px;
    }

    .hero-subtitle{
        font-size:23px;
        margin-top:14px;
    }

    .play-btn{
        height:73px;
        font-size:25px;
        margin-top:24px;
    }

    .tabs{
        margin-top:53px;
        height:70px;
    }

    .tab{
        font-size:21px;
        gap:10px;
    }

    .content{
        margin-top:31px;
    }

    .game-card{
        height:178px;
        padding:18px;
    }

    .game-icon{
        width:68px;
        height:68px;
    }

    .game-info{
        margin-left:17px;
    }

    .game-title{
        font-size:22px;
    }

    .game-subtitle{
        font-size:16px;
    }

    .telegram-card{
        min-height:126px;
        padding:17px;
    }

    .telegram-icon{
        width:64px;
        height:64px;
    }

    .telegram-info{
        margin-left:16px;
    }

    .telegram-title{
        font-size:22px;
    }

    .telegram-sub{
        font-size:16px;
    }

    .join-btn{
        min-width:145px;
        height:52px;
        font-size:17px;
    }

    .withdraw-card{
        height:252px;
    }

    .withdraw-title{
        font-size:22px;
    }

    .withdraw-sub{
        font-size:18px;
    }

    .bottom-nav{
        height:105px;
        padding:8px 18px 12px;
    }

    .nav-item{
        height:69px;
        font-size:16px;
    }

    .nav-icon{
        font-size:24px;
    }
}

@media(max-width:390px){

    .hero{
        padding-left:18px;
        padding-right:18px;
    }

    .hero h1{
        font-size:38px;
    }

    .hero-subtitle{
        font-size:20px;
    }

    .play-btn{
        width:88%;
        height:67px;
    }

    .tabs{
        width:94%;
    }

    .tab{
        font-size:18px;
    }

    .game-card{
        height:160px;
    }

    .game-title{
        font-size:19px;
    }

    .game-subtitle{
        font-size:14px;
    }

    .telegram-card{
        gap:4px;
    }

    .telegram-title{
        font-size:19px;
    }

    .telegram-sub{
        font-size:14px;
    }

    .join-btn{
        min-width:120px;
        font-size:15px;
    }
}

/* remove tap selection */
button{
    font-family:inherit;
    outline:none;
}

button:active{
    transform:scale(.98);
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="logo">
            <div class="logo-crown">♛</div>

            <div class="logo-text">
                TOP
                <span>LUDO</span>
            </div>
        </div>

        <div class="top-right">

            <div class="bell">🔔</div>

            <div class="balance">
                <div class="balance-symbol">৳</div>
                <span id="balance">0</span>
            </div>

        </div>

    </header>


    <!-- HERO -->
    <section class="hero">

        <div class="ludo-art">

            <div class="board"></div>

            <div class="pawn red"></div>
            <div class="pawn green"></div>
            <div class="pawn blue"></div>
            <div class="pawn yellow"></div>

            <div class="dice">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
                <span class="dot d4"></span>
                <span class="dot d5"></span>
                <span class="dot d6"></span>
            </div>

        </div>

        <h1>Top Ludo</h1>

        <div class="hero-subtitle">
            Ludo in under 10 minutes
        </div>

        <button class="play-btn" onclick="playNow()">
            Play Now
        </button>

    </section>


    <!-- TABS -->
    <div class="tabs">

        <button class="tab active" onclick="changeTab(this,'games')">
            <span class="tab-icon">🎮</span>
            <span>Games</span>
        </button>

        <button class="tab" onclick="changeTab(this,'others')">
            <span class="tab-icon">▦</span>
            <span>Others</span>
        </button>

    </div>


    <!-- CONTENT -->
    <main class="content" id="content">


        <!-- LUDO MATCHES -->
        <section class="game-card">

            <div class="game-icon">
                🎲
            </div>

            <div class="game-info">

                <div class="game-title">
                    Ludo Matches
                </div>

                <div class="game-subtitle">
                    REGULAR 1 VS 1
                </div>

            </div>

        </section>


        <!-- TELEGRAM -->
        <section class="telegram-card">

            <div class="telegram-icon">
                ➤
            </div>

            <div class="telegram-info">

                <div class="telegram-title">
                    Telegram
                </div>

                <div class="telegram-sub">
                    Get updates & latest news
                </div>

            </div>

            <button class="join-btn"
                    onclick="joinTelegram()">
                Join Now →
            </button>

        </section>


        <!-- WITHDRAWAL -->
        <section class="withdraw-card">

            <div class="shield">
                ✓
            </div>

            <div class="withdraw-title">
                Instant withdrawals
            </div>

            <div class="withdraw-sub">
                100% safe payments
            </div>


            <div class="chat">

                <div class="chat-bubble">
                    CHAT
                </div>

                <div class="chat-circle"></div>

                <div class="chat-dot a"></div>
                <div class="chat-dot b"></div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="nav-item active"
                onclick="navigation('home',this)">

            <span class="nav-icon">⌂</span>
            <span>Home</span>

        </button>


        <button class="nav-item"
                onclick="navigation('refer',this)">

            <span class="nav-icon">♟</span>
            <span>Refer</span>

        </button>


        <button class="nav-item"
                onclick="navigation('profile',this)">

            <span class="nav-icon">●</span>
            <span>Profile</span>

        </button>

    </nav>

</div>


<script>

/* =========================
   PLAY NOW
========================= */

function playNow(){

    alert("Play Now clicked");

}


/* =========================
   TELEGRAM
========================= */

function joinTelegram(){

    /*
      এখানে আপনার Telegram URL বসাবেন।

      Example:
      window.location.href =
      "https://t.me/your_channel";
    */

    alert("Telegram button clicked");

}


/* =========================
   TABS
========================= */

function changeTab(button,type){

    document
        .querySelectorAll(".tab")
        .forEach(tab=>{
            tab.classList.remove("active");
        });

    button.classList.add("active");

    const content =
        document.getElementById("content");

    if(type === "others"){

        content.innerHTML = `

            <section class="telegram-card"
                     style="margin-top:0;">

                <div class="telegram-icon">
                    ⋮
                </div>

                <div class="telegram-info">

                    <div class="telegram-title">
                        Others
                    </div>

                    <div class="telegram-sub">
                        More options coming soon
                    </div>

                </div>

            </section>

        `;

    }else{

        location.reload();

    }

}


/* =========================
   BOTTOM NAVIGATION
========================= */

function navigation(page,button){

    document
        .querySelectorAll(".nav-item")
        .forEach(item=>{
            item.classList.remove("active");
        });

    button.classList.add("active");

    if(page === "profile"){

        alert("Profile");

    }

    if(page === "refer"){

        alert("Refer");

    }

    if(page === "home"){

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}

function updateBalance(amount){

    balance = amount;

    document
        .getElementById("balance")
        .textContent = balance;

}
