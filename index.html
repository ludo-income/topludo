<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Ludo - Ludo in under 10 minutes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }

        /* Custom Dark Gradient Background */
        body {
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #0d2870 0%, #05133b 50%, #020718 100%);
            position: relative;
            box-shadow: 0 0 50px rgba(0, 100, 255, 0.2);
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        /* Outer glow highlights */
        .neon-card {
            background: linear-gradient(135deg, rgba(8, 30, 80, 0.8) 0%, rgba(3, 15, 45, 0.9) 100%);
            border: 1.5px solid rgba(0, 183, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.15), inset 0 0 10px rgba(0, 162, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .neon-card-active {
            border: 1.5px solid rgba(0, 225, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3), inset 0 0 15px rgba(0, 200, 255, 0.15);
        }

        /* Play Now Button Glow */
        .btn-yellow {
            background: linear-gradient(180deg, #fff33b 0%, #ffd000 50%, #e6a100 100%);
            box-shadow: 0 0 25px rgba(255, 208, 0, 0.6), inset 0 2px 2px rgba(255, 255, 255, 0.8);
            color: #000;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        .btn-yellow:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(255, 208, 0, 0.8);
        }

        .btn-cyan {
            background: linear-gradient(180deg, #00d2ff 0%, #0088ff 100%);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(0, 195, 255, 0.8), 0 0 30px rgba(0, 119, 255, 0.6);
        }

        /* Floating Animation for Dice & Pawns */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }

        .glow-bg {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Bottom Nav Styling */
        .bottom-nav {
            background: rgba(3, 14, 42, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1.5px solid rgba(0, 162, 255, 0.4);
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
        }

        .tab-btn-active {
            background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.6);
        }

        /* Ripple / Click Effect */
        .touch-effect {
            transition: transform 0.1s ease;
        }
        .touch-effect:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Main Mobile Container -->
    <div class="app-container">
        
        <!-- HEADER BAR -->
        <header class="flex justify-between items-center px-3 pt-4 pb-2 z-20">
            <!-- Logo Section - matches screenshot style -->
            <div class="flex items-center cursor-pointer touch-effect" onclick="showNotification('Top Ludo Home')">
                <div class="relative flex flex-col items-center leading-none">
                    <div class="text-[10px] text-yellow-400">♛</div>
                    <div class="font-montserrat font-black text-[22px] tracking-tighter" style="background: linear-gradient(90deg, #ff3b5c, #ffcc00, #00e676, #00bfff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));">
                        TOP
                    </div>
                    <div class="font-montserrat font-black text-[20px] -mt-1 tracking-tighter" style="background: linear-gradient(90deg, #00e676, #00bfff, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));">
                        LUDO
                    </div>
                </div>
            </div>

            <!-- Right Header Controls -->
            <div class="flex items-center space-x-3">
                <!-- Notification Bell -->
                <button onclick="showNotification('কোনো নতুন নোটিফিকেশন নেই')" class="relative p-2 rounded-full text-yellow-400 hover:text-yellow-300 touch-effect focus:outline-none">
                    <i class="fa-solid fa-bell text-2xl drop-shadow-[0_0_8px_rgba(255,215,0,0.8)]"></i>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                </button>

                <!-- Balance / Coins Badge - matches screenshot -->
                <div onclick="showNotification('ব্যালেন্স: ৳ 0.00')" class="flex items-center bg-black text-white font-extrabold px-3 py-1.5 rounded-full border border-white/40 shadow-[0_0_12px_rgba(0,0,0,0.5)] cursor-pointer touch-effect">
                    <span class="text-sm font-bold mr-1">৳</span>
                    <span class="text-base font-montserrat tracking-tight" id="user-balance">0</span>
                </div>
            </div>
        </header>

        <!-- HERO SECTION - using provided PNG graphic (logo + board + title) -->
        <section class="relative px-3 pt-1 pb-2 flex flex-col items-center text-center">
            <!-- Hero Image from provided PNG -->
            <div class="w-full flex justify-center -mt-1">
                <img src="hero.png" alt="Top Ludo" class="w-full max-w-[360px] h-auto object-contain">
            </div>

            <!-- Main CTA Button - full width, less side space -->
            <button onclick="startGame()" class="btn-yellow w-full py-3.5 px-6 rounded-full font-extrabold text-xl mt-3 flex items-center justify-center space-x-2 border-2 border-yellow-200 tracking-wider uppercase touch-effect cursor-pointer">
                <span>PLAY NOW</span>
                <i class="fa-solid fa-arrow-right text-lg"></i>
            </button>
        </section>

        <!-- CATEGORY NAVIGATION TAB -->
        <div class="px-3 my-3">
            <div class="bg-[#051842] p-1.5 rounded-full border border-blue-500/30 flex items-center shadow-inner">
                <!-- Games Tab (Active) -->
                <button id="tab-games" onclick="switchCategory('games')" class="flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 font-bold text-sm text-white btn-cyan transition-all duration-300 shadow-md">
                    <i class="fa-solid fa-gamepad text-base"></i>
                    <span>Games</span>
                </button>
                <!-- Others Tab -->
                <button id="tab-others" onclick="switchCategory('others')" class="flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 font-bold text-sm text-slate-300 hover:text-white transition-all duration-300">
                    <i class="fa-solid fa-border-all text-base"></i>
                    <span>Others</span>
                </button>
            </div>
        </div>

        <!-- MAIN CARDS CONTAINER -->
        <main id="content-games" class="px-3 space-y-3 flex-1">
            
            <!-- CARD 1: LUDO MATCHES -->
            <div onclick="selectMatch()" class="neon-card rounded-2xl p-3.5 flex items-center justify-between cursor-pointer touch-effect relative overflow-hidden group">
                <!-- Notification Badge -->
                <span class="absolute top-2 right-3 bg-yellow-400 text-black font-extrabold text-xs w-5 h-5 rounded-full flex items-center justify-center border border-white shadow-md z-10">0</span>

                <!-- Left Content -->
                <div class="flex items-center space-x-3 z-10">
                    <!-- Icon Thumbnail -->
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-900 p-0.5 border border-cyan-400 shadow-md flex items-center justify-center">
                        <div class="w-full h-full bg-slate-900 rounded-lg p-1 grid grid-cols-2 gap-0.5">
                            <div class="bg-red-500 rounded-xs"></div>
                            <div class="bg-green-500 rounded-xs"></div>
                            <div class="bg-blue-500 rounded-xs"></div>
                            <div class="bg-yellow-400 rounded-xs"></div>
                        </div>
                    </div>

                    <!-- Text Info -->
                    <div class="text-left">
                        <h3 class="text-lg font-extrabold text-white leading-snug tracking-wide">Ludo Matches</h3>
                        <p class="text-xs font-semibold text-cyan-300 tracking-wider uppercase">REGULAR 1 VS 1</p>
                    </div>
                </div>

                <!-- Right Graphic Mini Board -->
                <div class="relative w-28 h-16 flex items-center justify-end pr-1">
                    <div class="w-20 h-12 bg-blue-900/80 rounded-lg border border-cyan-400/50 transform rotate-12 flex items-center justify-around p-1 shadow-md">
                        <div class="w-3 h-7 bg-red-500 rounded-full border border-white"></div>
                        <div class="w-4 h-4 bg-white rounded border border-black flex items-center justify-center text-[8px] font-bold">4</div>
                        <div class="w-3 h-7 bg-yellow-400 rounded-full border border-white"></div>
                    </div>
                </div>
            </div>

            <!-- CARD 2: TELEGRAM BANNER -->
            <div onclick="openTelegram()" class="neon-card rounded-2xl p-3.5 flex items-center justify-between cursor-pointer touch-effect">
                <div class="flex items-center space-x-3">
                    <!-- Telegram Icon Circle -->
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-sky-500 to-blue-400 flex items-center justify-center shadow-[0_0_12px_rgba(56,189,248,0.5)] border border-white/40">
                        <i class="fa-solid fa-paper-plane text-white text-xl -translate-x-0.5 translate-y-0.5"></i>
                    </div>

                    <!-- Text -->
                    <div class="text-left">
                        <h3 class="text-base font-extrabold text-white">Telegram</h3>
                        <p class="text-xs text-slate-300">Get updates & latest news</p>
                    </div>
                </div>

                <!-- Join Button -->
                <button class="btn-yellow px-4 py-2 rounded-full font-extrabold text-xs flex items-center space-x-1 tracking-wide shadow-md">
                    <span>Join Now</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>

            <!-- CARD 3: INSTANT WITHDRAWALS & CHATBOT -->
            <div onclick="openSupport()" class="neon-card rounded-2xl p-4 relative overflow-hidden cursor-pointer touch-effect">
                <div class="flex items-center justify-between">
                    
                    <!-- Left Section: Shield & Text -->
                    <div class="flex flex-col items-start space-y-1 z-10">
                        <!-- Shield Icon -->
                        <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-400 flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.4)] mb-1">
                            <i class="fa-solid fa-shield-halved text-emerald-400 text-xl"></i>
                        </div>

                        <h3 class="text-lg font-extrabold text-white leading-tight">Instant withdrawals</h3>
                        <p class="text-xs text-cyan-300 font-medium">100% safe payments</p>
                    </div>

                    <!-- Right Section: 3D Chatbot Illustration -->
                    <div class="relative flex items-center justify-center w-24 h-20">
                        <!-- Chat Badge -->
                        <div class="absolute -top-1 right-1 bg-cyan-400 text-black font-black text-[10px] px-2 py-0.5 rounded-full shadow-md z-20 uppercase tracking-wider border border-white">
                            CHAT
                        </div>

                        <!-- Robot Body Mockup -->
                        <div class="w-14 h-14 bg-gradient-to-b from-cyan-300 to-blue-600 rounded-2xl border-2 border-white flex flex-col items-center justify-center shadow-[0_0_20px_rgba(0,210,255,0.5)] relative">
                            <!-- Eyes -->
                            <div class="w-10 h-4 bg-slate-900 rounded-full flex items-center justify-around px-1.5 border border-cyan-200">
                                <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
                                <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
                            </div>
                            <!-- Headphones -->
                            <div class="absolute -left-2 top-4 w-2 h-5 bg-yellow-400 rounded-l-md"></div>
                            <div class="absolute -right-2 top-4 w-2 h-5 bg-yellow-400 rounded-r-md"></div>
                        </div>

                        <!-- Chat Bubbles -->
                        <div class="absolute -bottom-1 -left-1 w-4 h-4 bg-cyan-400 rounded-full flex items-center justify-center text-[8px] text-black font-bold">...</div>
                        <div class="absolute top-2 left-0 w-3 h-3 bg-blue-400 rounded-full"></div>
                    </div>
                </div>
            </div>

        </main>

        <!-- OTHERS TAB CONTENT (Hidden by default) -->
        <main id="content-others" class="px-3 space-y-3 flex-1 hidden">
            <div class="neon-card rounded-2xl p-6 text-center text-slate-300">
                <i class="fa-solid fa-trophy text-4xl text-yellow-400 mb-2"></i>
                <h3 class="text-lg font-bold text-white">Leaderboard & Tournaments</h3>
                <p class="text-xs mt-1 text-slate-400">শীঘ্রই নতুন ফিচার ও টুর্নামেন্ট আসছে!</p>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="bottom-nav fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] px-6 py-2.5 flex justify-between items-center z-30">
            
            <!-- Home Item -->
            <button id="nav-home" onclick="setActiveNav('home')" class="tab-btn-active px-5 py-2 rounded-full flex items-center space-x-2 text-white font-bold text-sm transition-all duration-300">
                <i class="fa-solid fa-house text-base"></i>
                <span>Home</span>
            </button>

            <!-- Refer Item -->
            <button id="nav-refer" onclick="setActiveNav('refer')" class="px-4 py-2 rounded-full flex items-center space-x-1.5 text-slate-400 hover:text-white font-bold text-sm transition-all duration-300">
                <i class="fa-solid fa-user-group text-base"></i>
                <span>Refer</span>
            </button>

            <!-- Profile Item -->
            <button id="nav-profile" onclick="setActiveNav('profile')" class="px-4 py-2 rounded-full flex items-center space-x-1.5 text-slate-400 hover:text-white font-bold text-sm transition-all duration-300">
                <i class="fa-solid fa-user text-base"></i>
                <span>Profile</span>
            </button>

        </nav>

        <!-- Custom Notification Modal -->
        <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-900 border-2 border-cyan-400 rounded-2xl p-5 w-full max-w-xs text-center shadow-[0_0_30px_rgba(0,200,255,0.4)]">
                <div class="w-12 h-12 bg-cyan-500/20 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl border border-cyan-400">
                    <i class="fa-solid fa-circle-info"></i>
                </div>
                <h4 class="text-lg font-extrabold text-white mb-1" id="modal-title">Top Ludo</h4>
                <p class="text-sm text-slate-300 mb-4" id="modal-msg">মেসেজ লোড হচ্ছে...</p>
                <button onclick="closeModal()" class="btn-cyan text-white font-bold px-6 py-2 rounded-full w-full touch-effect">
                    ঠিক আছে
                </button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Category Switching (Games / Others)
        function switchCategory(category) {
            const gamesTab = document.getElementById('tab-games');
            const othersTab = document.getElementById('tab-others');
            const gamesContent = document.getElementById('content-games');
            const othersContent = document.getElementById('content-others');

            if (category === 'games') {
                gamesTab.className = "flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 font-bold text-sm text-white btn-cyan transition-all duration-300 shadow-md";
                othersTab.className = "flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 font-bold text-sm text-slate-300 hover:text-white transition-all duration-300";
                gamesContent.classList.remove('hidden');
                othersContent.classList.add('hidden');
            } else {
                othersTab.className = "flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 font-bold text-sm text-white btn-cyan transition-all duration-300 shadow-md";
                gamesTab.className = "flex-1 py-2.5 rounded-full flex items-center justify-center space-x-2 font-bold text-sm text-slate-300 hover:text-white transition-all duration-300";
                othersContent.classList.remove('hidden');
                gamesContent.classList.add('hidden');
            }
        }

        // Bottom Navigation Active State Handler
        function setActiveNav(navName) {
            const navItems = ['home', 'refer', 'profile'];
            
            navItems.forEach(item => {
                const btn = document.getElementById(`nav-${item}`);
                if (item === navName) {
                    btn.className = "tab-btn-active px-5 py-2 rounded-full flex items-center space-x-2 text-white font-bold text-sm transition-all duration-300";
                } else {
                    btn.className = "px-4 py-2 rounded-full flex items-center space-x-1.5 text-slate-400 hover:text-white font-bold text-sm transition-all duration-300";
                }
            });

            if (navName === 'refer') {
                showNotification('বন্ধুদের রেফার করে আয় করুন প্রতি রেফারে ৳ ৫০ টাকা!');
            } else if (navName === 'profile') {
                showNotification('প্রোফাইল সেটিংস ও গেমিং হিস্ট্রি শীঘ্রই আসছে।');
            }
        }

        // Action Trigger Functions
        function startGame() {
            showNotification('Top Ludo ম্যাচ তৈরি হচ্ছে! প্রতিপক্ষ খোঁজা হচ্ছে...');
        }

        function selectMatch() {
            showNotification('১ বনাম ১ রেগুলার লুডো টুর্নামেন্টে যোগ দিন!');
        }

        function openTelegram() {
            showNotification('আমাদের অফিশিয়াল টেলিগ্রাম চ্যানেলে যুক্ত হচ্ছেন...');
        }

        function openSupport() {
            showNotification('২৪/৭ লাইভ চ্যাট সাপোর্ট টিম প্রস্তুত রয়েছে।');
        }

        // Modal Message Popup
        function showNotification(message) {
            document.getElementById('modal-msg').innerText = message;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
