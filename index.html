<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>My App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: #000000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
    }

    .home-page-design {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="app">
    <img
      class="home-page-design"
      src="assets/home-page.jpg"
      alt="Home Page Design"
    />
  </div>
</body>
</html>
