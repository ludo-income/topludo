<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Top Ludo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#061a34;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
.app{
  width:100%;max-width:752px;min-height:100vh;margin:auto;
  background:
    radial-gradient(circle at 50% 20%,rgba(20,59,104,.35),transparent 34%),
    linear-gradient(180deg,#102d56 0%,#071b37 48%,#061a33 100%);
  padding-bottom:112px;
}
.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;padding:12px 25px}
.logo{width:138px;height:112px;object-fit:contain;object-position:center;mix-blend-mode:normal}
.top-right{display:flex;align-items:center;gap:12px}
.bell{font-size:28px;width:42px;height:42px;display:grid;place-items:center}
.balance{height:48px;min-width:84px;padding:0 9px;border-radius:28px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:8px;font-size:23px;font-weight:800}
.coin{width:27px;height:27px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:17px}
.hero{text-align:center;padding:0 26px}
.hero-img{width:100%;max-width:405px;height:260px;object-fit:contain;display:block;margin:-3px auto 0}
.hero h1{font-size:49px;line-height:1.05;margin-top:0;font-weight:800;letter-spacing:-1.4px}
.hero p{font-size:24px;color:#e1e5ec;margin-top:17px}
.play{width:88%;max-width:530px;height:72px;margin:27px auto 60px;border:0;border-radius:38px;background:linear-gradient(180deg,#ffe000,#ffc800);font-size:28px;font-weight:800;color:#050505;box-shadow:0 0 14px rgba(255,214,0,.85),0 0 34px rgba(255,196,0,.28)}
.tabs{height:78px;margin:0 30px 34px;padding:6px;border:1px solid rgba(156,202,230,.28);border-radius:30px;display:flex;background:rgba(4,22,43,.72)}
.tab{width:50%;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:25px;color:#e4e6ea;font-size:25px;font-weight:700}
.tab.active{background:linear-gradient(90deg,#09bce1,#22b8df);box-shadow:0 0 17px rgba(0,200,240,.30)}
.cards{padding:0 30px}
.card{position:relative;width:100%;border-radius:25px;overflow:hidden;margin-bottom:20px}
.matches{height:194px;background:#031b3b url("assets/ludo-match.jpg") center/cover no-repeat;display:flex;align-items:center;padding:24px}
.matches:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,19,43,.96) 0%,rgba(2,19,43,.72) 43%,rgba(2,19,43,.12) 100%)}
.match-content{position:relative;z-index:1;display:flex;align-items:center}
.match-icon{width:68px;height:68px;border-radius:14px;background:#071a35;display:grid;place-items:center;font-size:37px;margin-right:20px}
.match-title{font-size:25px;font-weight:800;margin-bottom:8px}
.match-sub{font-size:17px;letter-spacing:1.2px;color:#c3cbd7}
.zero-badge{position:absolute;z-index:2;right:0;top:-10px;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#ffe01a;color:#111;display:grid;place-items:center;font-size:15px;font-weight:800}
.telegram{height:136px;padding:22px 25px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#075a85,#07365e);border:1px solid rgba(0,190,255,.35);box-shadow:inset 0 0 24px rgba(0,180,255,.08)}
.tg-left{display:flex;align-items:center;gap:19px}
.tg-icon{width:64px;height:64px;border-radius:50%;background:#13afe5;display:grid;place-items:center;font-size:31px;font-weight:800}
.tg-title{font-size:25px;font-weight:800;margin-bottom:8px}
.tg-sub{font-size:17px;color:#d0dae5}
.join{border:0;border-radius:31px;background:#ffd000;color:#080808;font-size:18px;font-weight:800;padding:17px 25px;box-shadow:0 0 17px rgba(255,210,0,.42)}
.withdraw{height:258px;background:rgba(21,35,47,.90);border:1px solid rgba(145,170,185,.24);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.safe{width:92px;height:92px;border-radius:50%;background:#3ed75e;display:grid;place-items:center;font-size:44px;margin-bottom:24px;box-shadow:0 0 22px rgba(50,220,90,.27)}
.withdraw h2{font-size:27px;margin-bottom:14px}
.withdraw p{font-size:20px;color:#d1d6dd}
.chat{position:absolute;right:10px;bottom:8px;width:132px;height:120px;object-fit:contain;opacity:.95}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:752px;height:98px;padding:7px 26px 12px;display:flex;justify-content:space-around;align-items:center;background:rgba(4,22,43,.97);border-top:1px solid rgba(150,190,215,.16);z-index:20;backdrop-filter:blur(12px)}
.nav{width:32%;height:73px;border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:17px;font-weight:700}
.nav.active{background:linear-gradient(135deg,#426575,#527b8b);border:1px solid rgba(215,240,250,.48)}
.nav-icon{font-size:24px;line-height:1}
@media(max-width:500px){
 .topbar{height:86px;padding:10px 18px}.logo{width:126px;height:105px}
 .hero-img{height:270px;margin-top:-8px}.hero h1{font-size:45px}.hero p{font-size:23px}
 .play{height:69px;font-size:27px;margin-bottom:58px}
 .tabs{margin-left:30px;margin-right:30px}.tab{font-size:23px}
 .cards{padding:0 30px}.matches{height:194px}
}
@media(max-width:380px){
 .hero h1{font-size:39px}.hero p{font-size:20px}
 .cards{padding:0 20px}.tabs{margin-left:20px;margin-right:20px}
 .telegram{padding:18px}.tg-left{gap:12px}.tg-title{font-size:22px}.tg-sub{font-size:15px}.join{padding:15px 19px}
}
</style>
</head>
<body>
<div class="app">

<header class="topbar">
  <img class="logo" src="assets/top-ludo-logo.jpg" alt="Top Ludo">
  <div class="top-right">
    <div class="bell" aria-label="Notifications">🔔</div>
    <div class="balance"><span class="coin">৳</span><span>0</span></div>
  </div>
</header>

<section class="hero">
  <img class="hero-img" src="assets/ludo-hero.jpg" alt="">
  <h1>Top Ludo</h1>
  <p>Ludo in under 10 minutes</p>
  <button class="play">Play Now</button>
</section>

<div class="tabs">
  <div class="tab active">🎮 <span>Games</span></div>
  <div class="tab">▦ <span>Others</span></div>
</div>

<main class="cards">
  <section class="card matches">
    <div class="zero-badge">0</div>
    <div class="match-content">
      <div class="match-icon">🎲</div>
      <div>
        <div class="match-title">Ludo Matches</div>
        <div class="match-sub">REGULAR 1 VS 1</div>
      </div>
    </div>
  </section>

  <section class="card telegram">
    <div class="tg-left">
      <div class="tg-icon">➤</div>
      <div>
        <div class="tg-title">Telegram</div>
        <div class="tg-sub">Get updates & latest news</div>
      </div>
    </div>
    <button class="join">Join Now →</button>
  </section>

  <section class="card withdraw">
    <div class="safe">✓</div>
    <h2>Instant withdrawals</h2>
    <p>100% safe payments</p>
    <img class="chat" src="assets/chat-graphic.jpg" alt="">
  </section>
</main>
</div>

<nav class="bottom">
  <div class="nav active"><div class="nav-icon">⌂</div><div>Home</div></div>
  <div class="nav"><div class="nav-icon">♟</div><div>Refer</div></div>
  <div class="nav"><div class="nav-icon">●</div><div>Profile</div></div>
</nav>

<script>
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')}
});
document.querySelectorAll('.nav').forEach(n=>{
  n.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active')}
});
</script>
</body>
</html>
