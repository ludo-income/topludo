<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Ludo UI</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030a16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* App Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background: linear-gradient(180deg, #071733 0%, #030a18 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-y: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Scrollbar hide */
        .app-container::-webkit-scrollbar {
            display: none;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 45px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notification-btn {
            background: transparent;
            border: none;
            color: #ffcc00;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }

        .coin-badge {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .coin-icon {
            background: #000;
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* Main Content */
        .content {
            padding: 0 16px 80px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Hero Banner Section */
        .hero-section {
            text-align: center;
            margin-top: -10px;
            position: relative;
        }

        .ludo-board-img {
            width: 80%;
            max-width: 280px;
            margin: 0 auto;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-subtitle {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .play-now-btn {
            background: linear-gradient(180deg, #ffe600 0%, #ffb700 100%);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px 0;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-now-btn:active {
            transform: scale(0.98);
        }

        /* Navigation Switcher (Games / Others) */
        .nav-switch {
            background: rgba(10, 25, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            display: flex;
            padding: 4px;
        }

        .switch-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 25px;
            background: transparent;
            color: #a0aec0;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .switch-btn.active {
            background: #00c6ff;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(0, 198, 255, 0.4);
        }

        /* Card Component Common */
        .card {
            background: rgba(12, 30, 62, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Ludo Matches Card */
        .matches-card {
            display: flex;
            align-items: center;
            min-height: 100px;
            background: linear-gradient(90deg, rgba(8, 26, 56, 0.9) 0%, rgba(13, 40, 85, 0.9) 100%);
        }

        .badge-zero {
            position: absolute;
            top: -2px;
            right: 15px;
            background: #ffcc00;
            color: #000;
            font-weight: 800;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 0 0 8px 8px;
        }

        .matches-info {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .matches-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
        }

        .matches-text h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .matches-text p {
            font-size: 11px;
            color: #a0aec0;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .matches-bg-art {
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            height: 110%;
            opacity: 0.9;
            pointer-events: none;
        }

        /* Telegram Card */
        .telegram-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 28, 58, 0.7);
        }

        .telegram-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .telegram-icon-box {
            width: 44px;
            height: 44px;
            background: #0088cc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0, 136, 204, 0.4);
        }

        .telegram-text h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .telegram-text p {
            font-size: 11px;
            color: #a0aec0;
        }

        .join-btn {
            background: linear-gradient(180deg, #ffe600 0%, #ffb700 100%);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(255, 200, 0, 0.3);
        }

        /* Withdrawals Card */
        .withdrawals-card {
            text-align: center;
            padding: 24px 16px;
            background: rgba(10, 26, 52, 0.5);
            position: relative;
        }

        .check-icon-box {
            width: 50px;
            height: 50px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px auto;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
        }

        .withdrawals-card h3 {
            font-size: 17px;
            font-weight: 700;
        }

        .withdrawals-card p {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 2px;
        }

        /* Chat Widget */
        .chat-widget {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .chat-bubble {
            background: #00c6ff;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            margin-bottom: 2px;
        }

        .chat-bot-icon {
            width: 36px;
            height: 36px;
            background: #0d2e5c;
            border: 2px solid #00c6ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00c6ff;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #051329;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #a0aec0;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            width: 30%;
            padding: 6px 0;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header -->
        <div class="header">
            <div class="logo-section">
                <!-- SVG Mock Logo for Top Ludo -->
                <svg class="logo-img" viewBox="0 0 200 60" width="120">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M20 10 L30 2 L40 10 L35 25 L25 25 Z" fill="#ffcc00"/>
                    <text x="50" y="30" fill="#00c6ff" font-size="22" font-weight="900" font-family="Poppins">TOP</text>
                    <text x="50" y="50" fill="#e60000" font-size="22" font-weight="900" font-family="Poppins">LUDO</text>
                </svg>
            </div>
            <div class="header-right">
                <button class="notification-btn"><i class="fa-solid fa-bell"></i></button>
                <div class="coin-badge">
                    <span class="coin-icon">৳</span>
                    <span>0</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Main Content -->
        <div class="content">
            <!-- Hero Banner Section -->
            <div class="hero-section">
                <!-- Ludo Board Image Illustration -->
                <svg class="ludo-board-img" viewBox="0 0 300 200">
                    <g transform="rotate(-15 150 100)">
                        <rect x="60" y="40" width="180" height="120" rx="10" fill="#ffffff" stroke="#111" stroke-width="3"/>
                        <rect x="70" y="50" width="60" height="40" fill="#ff4757" rx="4"/>
                        <rect x="170" y="50" width="60" height="40" fill="#2ed573" rx="4"/>
                        <rect x="70" y="110" width="60" height="40" fill="#ffa502" rx="4"/>
                        <rect x="170" y="110" width="60" height="40" fill="#1e90ff" rx="4"/>
                        <!-- Dice in Middle -->
                        <rect x="135" y="85" width="30" height="30" rx="6" fill="#fff" stroke="#ccc" box-shadow="0 5px 15px rgba(0,0,0,0.3)"/>
                        <circle cx="143" cy="93" r="2.5" fill="#000"/>
                        <circle cx="157" cy="93" r="2.5" fill="#000"/>
                        <circle cx="150" cy="100" r="2.5" fill="#e60000"/>
                        <circle cx="143" cy="107" r="2.5" fill="#000"/>
                        <circle cx="157" cy="107" r="2.5" fill="#000"/>
                    </g>
                </svg>

                <h1 class="hero-title">Top Ludo</h1>
                <p class="hero-subtitle">Ludo in under 10 minutes</p>
                <button class="play-now-btn">Play Now</button>
            </div>

            <!-- Tab Switcher -->
            <div class="nav-switch">
                <button class="switch-btn active">
                    <i class="fa-solid fa-gamepad"></i> Games
                </button>
                <button class="switch-btn">
                    <i class="fa-solid fa-border-all"></i> Others
                </button>
            </div>

            <!-- Ludo Matches Card -->
            <div class="card matches-card">
                <span class="badge-zero">0</span>
                <div class="matches-info">
                    <svg class="matches-icon" viewBox="0 0 50 50">
                        <rect width="50" height="50" rx="10" fill="#0052cc"/>
                        <rect x="5" y="5" width="18" height="18" fill="#ff4757" rx="3"/>
                        <rect x="27" y="5" width="18" height="18" fill="#2ed573" rx="3"/>
                        <rect x="5" y="27" width="18" height="18" fill="#ffa502" rx="3"/>
                        <rect x="27" y="27" width="18" height="18" fill="#1e90ff" rx="3"/>
                    </svg>
                    <div class="matches-text">
                        <h3>Ludo Matches</h3>
                        <p>REGULAR 1 VS 1</p>
                    </div>
                </div>
            </div>

            <!-- Telegram Card -->
            <div class="card telegram-card">
                <div class="telegram-left">
                    <div class="telegram-icon-box">
                        <i class="fa-paper-plane"></i>
                    </div>
                    <div class="telegram-text">
                        <h3>Telegram</h3>
                        <p>Get updates & latest news</p>
                    </div>
                </div>
                <button class="join-btn">
                    Join Now <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- Instant Withdrawals Card -->
            <div class="card withdrawals-card">
                <div class="check-icon-box">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3>Instant withdrawals</h3>
                <p>100% safe payments</p>

                <!-- Floating Chat Widget -->
                <div class="chat-widget">
                    <span class="chat-bubble">CHAT</span>
                    <div class="chat-bot-icon">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-user-group"></i>
                <span>Refer</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>

</body>
  </html>
