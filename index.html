<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Top Ludo</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #070b1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: linear-gradient(180deg, #0a1025 0%, #070b1a 100%);
  position: relative;
  padding-bottom: 90px;
  overflow-x: hidden;
}

/* ========== HEADER ========== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px 8px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #ffd700, #ff9500);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 4px 12px rgba(255, 180, 0, 0.4);
}

.logo-icon::before {
  content: "👑";
  font-size: 18px;
  position: absolute;
  top: -8px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: 18px;
}

.coin-btn {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 15px;
}

.coin-btn span {
  font-size: 16px;
}

/* ========== HERO ========== */
.hero {
  text-align: center;
  padding: 10px 20px 20px;
}

.hero-visual {
  width: 220px;
  height: 180px;
  margin: 0 auto 12px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.board {
  width: 140px;
  height: 140px;
  background: linear-gradient(145deg, #1a2a4a, #0d1a30);
  border-radius: 16px;
  border: 3px solid #2a3f6a;
  position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transform: rotateX(20deg) rotateZ(-5deg);
}

.board::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 2px solid #3a5a8a;
  border-radius: 8px;
}

.pawn {
  width: 22px;
  height: 28px;
  border-radius: 50% 50% 40% 40%;
  position: absolute;
  box-shadow: 0 4px 8px rgba(0,0,0,0.4);
}

.pawn.red { background: linear-gradient(to bottom, #ff4d4d, #cc0000); top: 18px; left: 25px; }
.pawn.yellow { background: linear-gradient(to bottom, #ffd700, #e6b800); top: 55px; left: 15px; }
.pawn.green { background: linear-gradient(to bottom, #00e676, #00a854); top: 18px; right: 25px; }
.pawn.blue { background: linear-gradient(to bottom, #40c4ff, #0091ea); bottom: 25px; right: 20px; }

.dice {
  width: 48px;
  height: 48px;
  background: #fff;
  border-radius: 10px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(15deg);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 30px rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
  color: #222;
}

.lightning {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.hero h1 {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.hero p {
  font-size: 15px;
  color: #a0aec0;
  margin-bottom: 22px;
}

.play-btn {
  width: 100%;
  max-width: 320px;
  height: 56px;
  background: linear-gradient(90deg, #ffd700, #ffb700);
  border: none;
  border-radius: 28px;
  font-size: 20px;
  font-weight: 700;
  color: #1a1a1a;
  box-shadow: 0 8px 25px rgba(255, 200, 0, 0.4);
  cursor: pointer;
  transition: transform 0.15s;
}

.play-btn:active {
  transform: scale(0.97);
}

/* ========== TABS ========== */
.tabs {
  display: flex;
  gap: 12px;
  padding: 0 18px 18px;
}

.tab {
  flex: 1;
  height: 44px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  border: none;
  cursor: pointer;
}

.tab.active {
  background: #00c2ff;
  color: #003344;
}

.tab:not(.active) {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,0.15);
  color: #a0aec0;
}

/* ========== LUDO MATCHES ========== */
.card {
  margin: 0 18px 16px;
  background: linear-gradient(135deg, #121c35, #0d1528);
  border-radius: 18px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

.card-img {
  width: 70px;
  height: 70px;
  background: linear-gradient(145deg, #1e2d4d, #152038);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}

.card-img .mini-board {
  width: 48px;
  height: 48px;
  background: #0f1a30;
  border-radius: 8px;
  border: 2px solid #2a4068;
  position: relative;
}

.card-content h3 {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 2px;
}

.card-content p {
  font-size: 12px;
  color: #8899b0;
  letter-spacing: 0.5px;
}

.badge {
  position: absolute;
  top: 12px;
  right: 14px;
  background: #ffcc00;
  color: #1a1a1a;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
}

/* ========== TELEGRAM ========== */
.telegram-card {
  margin: 0 18px 16px;
  background: linear-gradient(135deg, #0d1a2f, #0a1425);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(0, 180, 255, 0.15);
}

.tg-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tg-icon {
  width: 42px;
  height: 42px;
  background: #0088cc;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.tg-text h3 {
  font-size: 16px;
  font-weight: 600;
}

.tg-text p {
  font-size: 12px;
  color: #8899b0;
}

.join-btn {
  background: #ffcc00;
  color: #1a1a1a;
  border: none;
  border-radius: 20px;
  padding: 8px 16px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

/* ========== WITHDRAWALS ========== */
.withdraw-card {
  margin: 0 18px 20px;
  background: linear-gradient(135deg, #0f1a30, #0c1525);
  border-radius: 18px;
  padding: 22px 16px;
  text-align: center;
  position: relative;
  border: 1px solid rgba(255,255,255,0.05);
}

.shield {
  width: 52px;
  height: 52px;
  background: #00c853;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  font-size: 26px;
  box-shadow: 0 0 20px rgba(0, 200, 83, 0.4);
}

.withdraw-card h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.withdraw-card p {
  font-size: 13px;
  color: #8899b0;
}

.chat-btn {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #00e5ff, #00b0ff);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 15px rgba(0, 180, 255, 0.5);
}

.chat-label {
  position: absolute;
  top: -8px;
  right: -6px;
  background: #00e5ff;
  color: #003344;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 6px;
}

/* ========== BOTTOM NAV ========== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  height: 70px;
  background: #0a1020;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding-bottom: 8px;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: #6b7a99;
  cursor: pointer;
}

.nav-item.active {
  color: #ffffff;
}

.nav-item .icon {
  font-size: 22px;
}

.nav-item.active .icon-bg {
  background: rgba(255,255,255,0.1);
  width: 48px;
  height: 32px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon"></div>
      <span>TOP <span style="color:#ffd700">LUDO</span></span>
    </div>
    <div class="header-right">
      <div class="icon-btn">🔔</div>
      <div class="coin-btn">
        <span>🪙</span>
        <span>0</span>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-visual">
      <div class="board">
        <div class="pawn red"></div>
        <div class="pawn yellow"></div>
        <div class="pawn green"></div>
        <div class="pawn blue"></div>
        <div class="dice">⚅</div>
      </div>
    </div>
    <h1>Top Ludo</h1>
    <p>Ludo in under 10 minutes</p>
    <button class="play-btn">Play Now</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active">🎮 Games</button>
    <button class="tab">▦ Others</button>
  </div>

  <!-- Ludo Matches -->
  <div class="card">
    <div class="card-img">
      <div class="mini-board"></div>
    </div>
    <div class="card-content">
      <h3>Ludo Matches</h3>
      <p>REGULAR 1 VS 1</p>
    </div>
    <div class="badge">0</div>
  </div>

  <!-- Telegram -->
  <div class="telegram-card">
    <div class="tg-left">
      <div class="tg-icon">✈️</div>
      <div class="tg-text">
        <h3>Telegram</h3>
        <p>Get updates & latest news</p>
      </div>
    </div>
    <button class="join-btn">Join Now →</button>
  </div>

  <!-- Instant Withdrawals -->
  <div class="withdraw-card">
    <div class="shield">🛡️</div>
    <h3>Instant withdrawals</h3>
    <p>100% safe payments</p>
    <div class="chat-btn">
      🤖
      <div class="chat-label">CHAT</div>
    </div>
  </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active">
    <div class="icon-bg"><span class="icon">🏠</span></div>
    <span>Home</span>
  </div>
  <div class="nav-item">
    <span class="icon">👥</span>
    <span>Refer</span>
  </div>
  <div class="nav-item">
    <span class="icon">👤</span>
    <span>Profile</span>
  </div>
</div>

</body>
</html>
