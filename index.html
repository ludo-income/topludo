<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"

<title>Top Ludo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#031a40;
}

body{
    overflow-x:hidden;
    font-family:Arial, sans-serif;
}


/* =========================================
   MAIN PIXEL-PERFECT SCREEN
========================================= */

.app{
    position:relative;

    width:100%;
    max-width:752px;

    margin:0 auto;

    /*
       IMPORTANT:
       আপনার original screenshot-এর
       exact ratio ধরে রাখবে।
    */

    aspect-ratio:752 / 1504;

    background-image:url("design.png");

    background-size:100% 100%;

    background-repeat:no-repeat;

    background-position:
        center top;
}


/* =========================================
   CLICKABLE AREAS
=========================================

   নিচের buttons/areas কোনো visual design
   তৈরি করে না।

   এগুলো transparent।
   তাই original image একদম একই থাকবে।
========================================= */


.click-area{
    position:absolute;

    display:block;

    background:transparent;

    border:0;

    padding:0;

    margin:0;

    cursor:pointer;

    z-index:20;
}


/* =========================================
   TOP LOGO
========================================= */

.logo-area{

    left:2%;

    top:1%;

    width:27%;

    height:11%;
}

}

    height:6%;

}


/* =========================================
   INSTANT WITHDRAWALS
========================================= */

    top:78.2%;

    height:16%;

/* =========================================
   BOTTOM NAV
========================================= */

.home-area{

    left:3%;

    bottom:0;

    width:30%;

    height:8%;

}


.refer-area{

    bottom:0;

    width:30%;

    height:8%;

}


.profile-area{

/* =========================================
   DESKTOP
========================================= */

@media(min-width:753px){

    body{

        justify-content:center;
    }

    .app{
        min-height:100vh;
        height:auto;
    }

}


/* =========================================

========================================= */

</style>
